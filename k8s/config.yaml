apiVersion: v1
kind: ConfigMap
metadata:
  name: boursoum-config
  namespace: boursoum
data:
  APP_ENV: production
  APP_NAME: Boursoum
  PORT: "5000"
  FLASK_DEBUG: "0"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: boursoum
  POSTGRES_USER: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: boursoum-secrets
  namespace: boursoum
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me